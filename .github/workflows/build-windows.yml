name: Build Windows

on:
  push:
    branches: [main, feature/mac]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.5'

      - name: Install dependencies
        working-directory: code/HuaweiNoteFlutter
        run: flutter pub get

      - name: Build Windows
        working-directory: code/HuaweiNoteFlutter
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwnote-windows
          path: code/HuaweiNoteFlutter/build/windows/x64/runner/Release/
          retention-days: 30
