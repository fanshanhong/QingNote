name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: code/HuaweiNoteFlutter
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Build macOS
        working-directory: code/HuaweiNoteFlutter
        run: flutter build macos --release

      - name: Package DMG
        run: |
          hdiutil create -volname QingNote \
            -srcfolder code/HuaweiNoteFlutter/build/macos/Build/Products/Release/QingNote.app \
            -ov -format UDZO QingNote-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingNote-macOS
          path: QingNote-macOS.dmg
          retention-days: 30