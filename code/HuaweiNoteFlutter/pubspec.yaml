name: hwnote
description: HwNote - 华为风格备忘录
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  flutter_staggered_grid_view: ^0.7.0
  appflowy_editor: ">=6.0.0 <7.0.0"
  share_plus: ^12.0.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  record: ^5.1.2
  just_audio: ^0.9.40
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dependency_overrides:
  record_platform_interface: 1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
